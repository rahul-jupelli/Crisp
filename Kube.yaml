apiVersion: apps/v1
kind: Deployment
metadata:
  name: hms
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hms
  template:
    metadata:
      labels:
        app: hms
    spec:
      containers:
        - name: hms
          image: saiteja0000/hms:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: hms
spec:
  type: ClusterIP
  selector:
    app: hms
  ports:
    - port: 80
      targetPort: 8080
      protocol: TCP